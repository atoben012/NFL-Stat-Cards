<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFL Stat Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --line:#2a313c; --text:#e6edf3; --muted:#8b949e;
  --accent:#3fb950; --warn:#d29922; --bad:#f85149;
  --team:#013369; --team2:#d50a0a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
header{padding:20px 16px 8px;max-width:1100px;margin:auto}
h1{font-family:Oswald,sans-serif;margin:0;font-size:28px;letter-spacing:.5px}
header p{color:var(--muted);margin:4px 0 0;font-size:14px}
main{max-width:1100px;margin:auto;padding:12px 16px 40px;display:grid;grid-template-columns:340px 1fr;gap:20px}
@media (max-width:820px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 6px}
label:first-child{margin-top:0}
select,input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0d1117;color:var(--text);font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:8px;border:0;background:transparent;color:var(--muted);font:600 13px Inter;cursor:pointer}
.seg button.on{background:var(--accent);color:#06210f}
.results{max-height:220px;overflow:auto;margin-top:6px}
.results div{padding:8px;border-radius:6px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between}
.results div:hover{background:#21262d}
.results small{color:var(--muted)}
.links{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.links a{color:#58a6ff;font-size:14px;text-decoration:none}
.links a:hover{text-decoration:underline}
.status{font-size:13px;color:var(--muted);margin-top:10px;min-height:18px}
.status.err{color:var(--bad)}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px}
.empty{color:var(--muted);text-align:center;padding:80px 20px;border:1px dashed var(--line);border-radius:12px;width:100%}
.btn{padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:#21262d;color:var(--text);font:600 14px Inter;cursor:pointer}
.btn:hover{background:#30363d}

/* ---------- Card ---------- */
.card{width:420px;max-width:100%;border-radius:18px;overflow:hidden;position:relative;
  background:linear-gradient(160deg,var(--team) 0%,#0b0f14 70%);box-shadow:0 20px 50px rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.12)}
.card .stripe{position:absolute;top:0;right:-60px;width:220px;height:100%;background:var(--team2);opacity:.18;transform:skewX(-18deg)}
.card .top{position:relative;display:flex;align-items:flex-end;gap:10px;padding:18px 18px 0;min-height:190px}
.card .head{width:170px;height:124px;object-fit:cover;object-position:top;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.card .who{flex:1;padding-bottom:14px}
.card .pos{display:inline-block;font:700 12px Oswald;letter-spacing:1px;background:rgba(255,255,255,.15);padding:3px 8px;border-radius:4px}
.card .name{font:700 30px/1 Oswald;text-transform:uppercase;margin:8px 0 4px}
.card .team{font-size:13px;color:rgba(255,255,255,.75)}
.card .tlogo{position:absolute;top:14px;right:16px;width:46px;height:46px}
.card .game{position:relative;display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.35);padding:10px 18px;font-size:13px}
.card .game b{font-family:Oswald;font-size:15px;letter-spacing:.5px}
.res-W{color:var(--accent)}.res-L{color:var(--bad)}.res-T{color:var(--warn)}
.card .fp{position:relative;display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px}
.card .fp .big{font:700 56px/1 Oswald}
.card .fp .lbl{font-size:11px;letter-spacing:1px;color:rgba(255,255,255,.7);text-transform:uppercase}
.badge{font:700 16px Oswald;letter-spacing:1.5px;padding:8px 14px;border-radius:8px;text-transform:uppercase}
.b-smash{background:#3fb950;color:#06210f}.b-solid{background:#58a6ff;color:#041a33}
.b-meh{background:#d29922;color:#2b1d00}.b-dud{background:#f85149;color:#2d0503}.b-na{background:#30363d;color:#c9d1d9}
.card .grid{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 18px 18px}
.card .stat{background:rgba(255,255,255,.07);border-radius:10px;padding:10px 6px;text-align:center}
.card .stat .v{font:700 24px Oswald}
.card .stat .k{font-size:10px;letter-spacing:.8px;color:rgba(255,255,255,.65);text-transform:uppercase;margin-top:2px}
.card .foot{position:relative;display:flex;justify-content:space-between;padding:8px 18px 12px;font-size:10px;color:rgba(255,255,255,.45);letter-spacing:.5px}
</style>
</head>
<body>
<header>
  <h1>🏈 NFL Fantasy Stat Cards</h1>
  <p>Live player data from ESPN, with links to each player's ESPN and NFL.com stat pages.</p>
</header>

<main>
  <section class="panel">
    <label for="q">Quick search</label>
    <input id="q" placeholder="e.g. Jefferson, Mahomes, Bijan…" autocomplete="off">
    <div class="results" id="results"></div>

    <label for="team">Or browse by team</label>
    <select id="team"><option value="">Loading teams…</option></select>
    <label for="player">Player</label>
    <select id="player" disabled><option>Pick a team first</option></select>

    <div class="row">
      <div><label for="season">Season</label><select id="season"></select></div>
      <div><label for="game">Game</label><select id="game" disabled><option>—</option></select></div>
    </div>

    <label>Scoring</label>
    <div class="seg" id="scoring">
      <button data-v="1" class="on">PPR</button><button data-v="0.5">Half</button><button data-v="0">Std</button>
    </div>

    <div class="links" id="links"></div>
    <div class="status" id="status"></div>
  </section>

  <section class="stage" id="stage">
    <div class="empty">Search for a player or pick a team and player to build a stat card.</div>
  </section>
</main>

<script>
const ESPN_SITE = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl';
const ESPN_WEB  = 'https://site.web.api.espn.com/apis/common/v3';
const $ = id => document.getElementById(id);

const state = { athlete:null, log:null, rows:[], ppr:1, season:null };

/* ---------- helpers ---------- */
function setStatus(msg, err=false){ const s=$('status'); s.textContent=msg||''; s.className='status'+(err?' err':''); }
async function getJSON(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}
const num = v => { if(v==null) return 0; const n=parseFloat(String(v).replace(/,/g,'')); return isNaN(n)?0:n; };
const slug = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const fmt = n => Number.isInteger(n) ? n : n.toFixed(1);

/* ---------- seasons ---------- */
(function initSeasons(){
  const now = new Date();
  const cur = now.getMonth() >= 7 ? now.getFullYear() : now.getFullYear()-1; // NFL season starts Sept
  for(let y=cur; y>=cur-5; y--) $('season').add(new Option(`${y}`, y));
  state.season = cur;
})();

/* ---------- teams & rosters ---------- */
async function loadTeams(){
  try{
    const d = await getJSON(`${ESPN_SITE}/teams`);
    const teams = d.sports[0].leagues[0].teams.map(t=>t.team).sort((a,b)=>a.displayName.localeCompare(b.displayName));
    const sel = $('team'); sel.innerHTML = '<option value="">Select a team</option>';
    teams.forEach(t => sel.add(new Option(t.displayName, t.id)));
  }catch(e){
    $('team').innerHTML = '<option>Could not load teams</option>';
    setStatus('Could not reach ESPN. Check your connection, or try opening the file in a different browser.', true);
  }
}
const POS_ORDER = ['QB','RB','FB','WR','TE','K','PK','P'];
async function loadRoster(teamId){
  const sel = $('player'); sel.disabled = true; sel.innerHTML = '<option>Loading roster…</option>';
  try{
    const d = await getJSON(`${ESPN_SITE}/teams/${teamId}/roster`);
    const all = (d.athletes||[]).flatMap(g => g.items || []);
    all.sort((a,b)=>{
      const pa=POS_ORDER.indexOf(a.position?.abbreviation), pb=POS_ORDER.indexOf(b.position?.abbreviation);
      return (pa<0?99:pa)-(pb<0?99:pb) || a.displayName.localeCompare(b.displayName);
    });
    sel.innerHTML = '<option value="">Select a player</option>';
    all.forEach(p => sel.add(new Option(`${p.position?.abbreviation||''} · ${p.displayName}${p.jersey?' #'+p.jersey:''}`, p.id)));
    sel.disabled = false;
  }catch(e){ sel.innerHTML = '<option>Roster unavailable</option>'; setStatus('Roster failed to load: '+e.message, true); }
}

/* ---------- quick search ---------- */
let searchTimer;
$('q').addEventListener('input', e=>{
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  if(q.length < 2){ $('results').innerHTML=''; return; }
  searchTimer = setTimeout(()=>search(q), 250);
});
async function search(q){
  try{
    const d = await getJSON(`${ESPN_WEB}/search?query=${encodeURIComponent(q)}&limit=10&type=player&sport=football&league=nfl`);
    const items = (d.items || d.results?.flatMap(r=>r.contents||[]) || [])
      .filter(i => !i.league || /nfl/i.test(i.league) || /nfl/i.test(i.defaultLeagueSlug||''));
    const box = $('results'); box.innerHTML='';
    if(!items.length){ box.innerHTML='<div><small>No matches — try the team picker.</small></div>'; return; }
    items.forEach(i=>{
      const id = i.id || (i.uid||'').split('a:').pop();
      const div = document.createElement('div');
      div.innerHTML = `<span>${i.displayName||i.name}</span><small>${i.subtitle||i.description||''}</small>`;
      div.onclick = ()=>{ box.innerHTML=''; $('q').value = i.displayName||i.name; selectPlayer(id); };
      box.appendChild(div);
    });
  }catch(e){ $('results').innerHTML='<div><small>Search unavailable — use the team picker.</small></div>'; }
}

/* ---------- player + game log ---------- */
async function selectPlayer(id){
  if(!id) return;
  setStatus('Loading player…');
  try{
    const [info, log] = await Promise.all([
      getJSON(`${ESPN_WEB}/sports/football/nfl/athletes/${id}`),
      getJSON(`${ESPN_WEB}/sports/football/nfl/athletes/${id}/gamelog?season=${state.season}`).catch(()=>null)
    ]);
    state.athlete = info.athlete || info;
    state.log = log;
    buildRows();
    renderLinks();
    fillGames();
    setStatus(state.rows.length ? '' : `No ${state.season} regular-season games found for this player.`);
    render();
  }catch(e){ setStatus('Could not load player: '+e.message, true); }
}

function buildRows(){
  state.rows = [];
  const log = state.log; if(!log) return;
  const names = log.names || [];
  const events = log.events || {};
  (log.seasonTypes||[])
    .filter(st => /regular|post/i.test(st.displayName||''))
    .forEach(st => (st.categories||[]).forEach(cat => (cat.events||[]).forEach(ev=>{
      const s = {}; names.forEach((n,i)=> s[n] = ev.stats?.[i]);
      const meta = events[ev.eventId] || {};
      state.rows.push({ id:ev.eventId, s, meta, post:/post/i.test(st.displayName) });
    })));
  state.rows.sort((a,b)=> new Date(a.meta.gameDate) - new Date(b.meta.gameDate));
}

function fillGames(){
  const sel = $('game'); sel.innerHTML='';
  if(!state.rows.length){ sel.add(new Option('No games',''));sel.disabled=true; return; }
  sel.add(new Option('Season to date','season'));
  [...state.rows].reverse().forEach(r=>{
    const m=r.meta, wk = r.post ? 'Playoffs' : `Wk ${m.week ?? '?'}`;
    sel.add(new Option(`${wk} ${m.atVs||'vs'} ${m.opponent?.abbreviation||'?'} (${m.gameResult||''} ${m.score||''})`, r.id));
  });
  sel.disabled=false;
  sel.selectedIndex = 1; // latest game
}

function renderLinks(){
  const a = state.athlete, n = slug(a.displayName || a.fullName);
  $('links').innerHTML = `
    <a href="https://www.espn.com/nfl/player/_/id/${a.id}/${n}" target="_blank" rel="noopener">ESPN player page ↗</a>
    <a href="https://www.espn.com/nfl/player/gamelog/_/id/${a.id}/${n}" target="_blank" rel="noopener">ESPN game log ↗</a>
    <a href="https://www.nfl.com/players/${n}/stats/logs/${state.season}/" target="_blank" rel="noopener">NFL.com game logs ↗</a>
    <a href="https://www.nfl.com/players/${n}/stats/" target="_blank" rel="noopener">NFL.com career stats ↗</a>
    <span id="boxLink"></span>`;
}

/* ---------- fantasy math ---------- */
function fantasy(s){
  const rec = num(s.receptions);
  return num(s.passingYards)/25 + num(s.passingTouchdowns)*4 - num(s.interceptions)*2
       + num(s.rushingYards)/10 + num(s.rushingTouchdowns)*6
       + num(s.receivingYards)/10 + num(s.receivingTouchdowns)*6 + rec*state.ppr
       - num(s.fumblesLost)*2;
}
function verdict(pts, pos, isSeason, games){
  if(['K','PK','P'].includes(pos)) return ['N/A','b-na'];
  const p = isSeason ? pts/Math.max(games,1) : pts;
  const t = pos==='QB' ? [24,17,12] : pos==='TE' ? [16,10,6] : [20,13,8];
  return p>=t[0]?['Smash','b-smash']:p>=t[1]?['Solid','b-solid']:p>=t[2]?['Meh','b-meh']:['Dud','b-dud'];
}

/* ---------- stat layouts by position ---------- */
function statTiles(s, pos){
  const g = k => fmt(num(s[k]));
  if(pos==='QB') return [
    [`${g('completions')}/${g('passingAttempts')}`,'Comp/Att'],[g('passingYards'),'Pass Yds'],[g('passingTouchdowns'),'Pass TD'],
    [g('interceptions'),'INT'],[g('rushingYards'),'Rush Yds'],[g('rushingTouchdowns'),'Rush TD']];
  if(pos==='RB' || pos==='FB') return [
    [g('rushingAttempts'),'Carries'],[g('rushingYards'),'Rush Yds'],[g('rushingTouchdowns'),'Rush TD'],
    [g('receptions'),'Rec'],[g('receivingYards'),'Rec Yds'],[g('receivingTargets'),'Targets']];
  if(pos==='WR' || pos==='TE'){
    const ypr = num(s.receptions) ? (num(s.receivingYards)/num(s.receptions)).toFixed(1) : '0.0';
    return [[`${g('receptions')}/${g('receivingTargets')}`,'Rec/Tgt'],[g('receivingYards'),'Rec Yds'],[g('receivingTouchdowns'),'Rec TD'],
      [ypr,'Yds/Rec'],[g('longReception'),'Long'],[g('rushingYards'),'Rush Yds']];
  }
  // fallback: first six stats with values
  const labels = state.log?.labels || [], names = state.log?.names || [];
  return names.map((n,i)=>[s[n],labels[i]||n]).filter(x=>x[0]!=null && x[0]!=='').slice(0,6);
}

function seasonTotals(){
  const tot = {}; const maxKeys = ['longReception','longRushing','longPassing'];
  state.rows.filter(r=>!r.post).forEach(r=>Object.entries(r.s).forEach(([k,v])=>{
    if(maxKeys.includes(k)) tot[k] = Math.max(tot[k]||0, num(v));
    else tot[k] = (tot[k]||0) + num(v);
  }));
  return tot;
}

/* ---------- render card ---------- */
function render(){
  const a = state.athlete; if(!a) return;
  const pos = a.position?.abbreviation || '';
  const team = a.team || {};
  const color = '#'+(team.color||'013369'), color2 = '#'+(team.alternateColor||'d50a0a');
  const gid = $('game').value;
  const isSeason = gid==='season';
  let s, meta = {}, games = 0;

  if(!state.rows.length){ s = {}; }
  else if(isSeason){ s = seasonTotals(); games = state.rows.filter(r=>!r.post).length; }
  else { const r = state.rows.find(r=>r.id===gid) || state.rows[state.rows.length-1]; s=r.s; meta=r.meta; }

  const pts = fantasy(s);
  const [vText,vCls] = verdict(pts,pos,isSeason,games);
  const scoring = state.ppr===1?'PPR':state.ppr===0.5?'Half PPR':'Standard';
  const head = a.headshot?.href || `https://a.espncdn.com/i/headshots/nfl/players/full/${a.id}.png`;
  const tlogo = team.logos?.[0]?.href || team.logo || '';
  const res = meta.gameResult || '';

  const gameLine = !state.rows.length ? `<span>No ${state.season} games yet</span><b></b>`
    : isSeason ? `<span>${state.season} Season · ${games} games</span><b>${fmt(pts/Math.max(games,1))} PPG</b>`
    : `<span>${meta.week?'Week '+meta.week:''} · ${meta.atVs||'vs'} ${meta.opponent?.displayName||meta.opponent?.abbreviation||''}</span>
       <b class="res-${res}">${res} ${meta.score||''}</b>`;

  $('boxLink').innerHTML = (!isSeason && meta && gid) ? `<a href="https://www.espn.com/nfl/game/_/gameId/${gid}" target="_blank" rel="noopener">ESPN box score for this game ↗</a>` : '';

  $('stage').innerHTML = `
    <div class="card" id="card" style="--team:${color};--team2:${color2}">
      <div class="stripe"></div>
      ${tlogo?`<img class="tlogo" src="${tlogo}" crossorigin="anonymous" alt="">`:''}
      <div class="top">
        <img class="head" src="${head}" crossorigin="anonymous" alt="" onerror="this.style.visibility='hidden'">
        <div class="who">
          <span class="pos">${pos}${a.jersey?' · #'+a.jersey:''}</span>
          <div class="name">${a.displayName||a.fullName}</div>
          <div class="team">${team.displayName||''}</div>
        </div>
      </div>
      <div class="game">${gameLine}</div>
      <div class="fp">
        <div><div class="big">${fmt(pts)}</div><div class="lbl">${scoring} fantasy pts${isSeason?' (total)':''}</div></div>
        <div class="badge ${vCls}">${vText}</div>
      </div>
      <div class="grid">${statTiles(s,pos).map(([v,k])=>`<div class="stat"><div class="v">${v??'–'}</div><div class="k">${k}</div></div>`).join('')}</div>
      <div class="foot"><span>Data: ESPN</span><span>${new Date().toLocaleDateString()}</span></div>
    </div>
    <button class="btn" id="dl">⬇ Download card as PNG</button>`;
  $('dl').onclick = downloadCard;
}

async function downloadCard(){
  try{
    const c = await html2canvas($('card'), {useCORS:true, backgroundColor:null, scale:2});
    const a = document.createElement('a');
    a.download = slug(state.athlete.displayName)+'-card.png'; a.href = c.toDataURL('image/png'); a.click();
  }catch(e){ setStatus('PNG export was blocked by image permissions — take a screenshot instead.', true); }
}

/* ---------- wiring ---------- */
$('team').onchange = e => e.target.value && loadRoster(e.target.value);
$('player').onchange = e => selectPlayer(e.target.value);
$('game').onchange = render;
$('season').onchange = e => { state.season = +e.target.value; if(state.athlete) selectPlayer(state.athlete.id); };
$('scoring').onclick = e => {
  const b = e.target.closest('button'); if(!b) return;
  [...$('scoring').children].forEach(x=>x.classList.toggle('on', x===b));
  state.ppr = +b.dataset.v; render();
};
loadTeams();
</script>
</body>
</html>
